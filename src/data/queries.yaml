---
queries:
  article:
    getTagIds: |2
      SELECT
        requested.article_id,
        COALESCE(
            array_agg(mapping.tag_id ORDER BY mapping.tag_id)
                FILTER (WHERE mapping.tag_id IS NOT NULL),
            ARRAY[]::integer[]
        ) AS tag_ids
      FROM (
        SELECT DISTINCT unnest($1::integer[]) AS article_id
      ) AS requested
      LEFT JOIN article_tag AS mapping
        ON mapping.article_id = requested.article_id
      GROUP BY requested.article_id;
