---
queries:
  article:
    getFeatured: |2
      SELECT a.id AS id, title, p.name AS permalink,
        ARRAY(
            SELECT ROW(t.title, t.color, t.important, t.seq) AS tags
            FROM tags AS t, article_tag AS at
            WHERE at.tag_id = t.id AND at.article_id = a.id
            ORDER BY t.seq
          ) AS tags
      FROM articles AS a, permalinks AS p
      WHERE a.is_featured = TRUE
        AND p.id = a.primary_permalink_id;

    getSummariesById: |2
      SELECT
        a.id AS id,
        a.title AS TITLE,
        p.name AS permalink,
        c.name AS content_type,
        f.name AS form_factor,
        a.info AS info,
        ARRAY(
            SELECT ROW(t.title, t.color, t.important, t.seq) AS tags
            FROM tags AS t, article_tag AS at
            WHERE at.tag_id = t.id AND at.article_id = a.id
            ORDER BY t.seq
          ) AS tags
        a.is_featured AS is_featured,
        a.active_dt AS active_dt
      FROM articles AS a
      LEFT JOIN permalinks AS p ON p.id = a.primary_permalink_id
      JOIN content_types AS c ON c.id = a.content_type_id
      JOIN form_factors AS f ON f.id = c.form_factor_id
      WHERE a.id = ANY($1::int[]);

  user:
    createUser:
      description: Create a new user
      query: |
        INSERT INTO people (
          username, displayname, realm_id, isauthor, info
        ) VALUES (
          $1::STRING,
          $2::STRING,
          (SELECT id FROM realms WHERE name = $3::STRING),
          $4::BOOLEAN,
          '{}'
        ) RETURNING id;
    getUser:
      # Conventionally, getX gets X by its name, while getXById gets X by its id.
      description: Get a user by their username
      query: |
        SELECT * FROM people WHERE username = $1;
    getUserById:
      description: Get a user by their ID
      query: |
        SELECT * FROM people WHERE id = $1;
    
